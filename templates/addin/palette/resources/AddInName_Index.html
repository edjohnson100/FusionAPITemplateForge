<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <div id="app">
    <div class="header">
      <div>
        <h2>AddInName</h2>
        <div id="versionTag" class="sub-header"></div>
      </div>
      <select id="theme.name" style="width: auto; height: 28px; font-size: 11px; padding: 2px 5px;">
        <option value="System">System (Default)</option>
        <option value="Light">Light</option>
        <option value="Dark">Dark</option>
        <option value="Midnight">Midnight</option>
        <option value="Sandstone">Sandstone</option>
      </select>
    </div>

    <div class="tabs">
      <button class="tab-button active" data-tab="main">Main</button>
      <button class="tab-button" data-tab="themes">Themes</button>
    </div>

    <div id="notification" class="notification hidden"></div>

    <div id="tab-main" class="tab-panel active">
      <!-- TODO: replace this example section with your add-in's real fields. -->
      <details class="section" open>
        <summary>Example</summary>
        <label>Example value <input type="number" step="0.1" id="main.exampleValue"></label>
        <span class="field-error" data-error-for="exampleValue"></span>
      </details>

      <div id="main-notification" class="notification hidden"></div>

      <details class="section" open>
        <summary>Configurations</summary>
        <div class="config-active" id="main-config-active"></div>
        <div class="actions secondary">
          <button type="button" data-config-action="load" data-tab="main">Load&hellip;</button>
          <button type="button" data-config-action="delete" data-tab="main">Delete&hellip;</button>
        </div>
        <div class="actions secondary">
          <button type="button" data-config-action="save_as" data-tab="main">Save As&hellip;</button>
          <button type="button" id="main-config-update" data-config-action="update_current" data-tab="main">Update Current</button>
        </div>
        <div class="actions secondary">
          <button type="button" data-action="factory_reset" data-tab="main">Factory Reset</button>
        </div>
      </details>

      <div class="actions">
        <button type="button" data-action="update_preview" data-tab="main">Update Preview</button>
        <button type="button" data-action="generate" data-tab="main">Generate</button>
      </div>
      <div class="actions secondary">
        <button type="button" class="clear-preview-button" data-action="clear_preview" data-tab="main" disabled>Clear Preview</button>
      </div>
    </div>

    <div id="tab-themes" class="tab-panel">
      <details class="section" open>
        <summary>Themes</summary>
        <span class="field-hint">"System" (in the header above) follows your OS's light/dark setting automatically.</span>

        <label>Font family
          <select id="theme.fontFamily">
            <option value="-apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Sans-serif</option>
            <option value="Georgia, &quot;Times New Roman&quot;, Times, serif">Serif</option>
            <option value="Consolas, &quot;Courier New&quot;, Courier, monospace">Monospace</option>
          </select>
        </label>
        <label>Base font size (px)
          <input type="number" id="theme.fontSize" min="10" max="20" step="1">
        </label>
        <span class="field-hint">Font settings apply on top of whichever theme is selected above, and are included when you export a theme below.</span>

        <div class="actions secondary">
          <button type="button" id="theme-import-json">Import theme.json&hellip;</button>
          <button type="button" id="theme-export-json">Export theme.json&hellip;</button>
        </div>
        <div class="actions secondary">
          <button type="button" id="theme-import-css">Import style.css&hellip;</button>
          <button type="button" id="theme-export-css">Export style.css&hellip;</button>
        </div>
        <div class="actions secondary">
          <button type="button" id="theme-remove" disabled>Remove Selected Theme</button>
          <button type="button" id="theme-factory-reset">Factory Reset Themes</button>
        </div>
        <span class="field-hint" id="theme-import-hint"></span>
      </details>
    </div>

    <div class="field-hint version-footer">AddInName<br><span id="footerVersion">vX.Y.Z</span></div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" tabindex="-1">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="modal-btn-cancel" id="modal-btn-cancel">Cancel</button>
        <button type="button" class="modal-btn-confirm" id="modal-btn-confirm">OK</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=1"></script>
</body>
</html>
